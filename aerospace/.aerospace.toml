# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
'workspace 1'
]
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 0
outer.right = 8

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right
[mode.main.binding]
cmd-alt-ctrl-slash = 'layout tiles horizontal vertical'
cmd-alt-ctrl-comma = 'layout accordion horizontal vertical'
cmd-alt-ctrl-f = 'layout floating tiling'
cmd-alt-ctrl-z = 'fullscreen'
cmd-alt-ctrl-shift-z = 'macos-native-fullscreen'
cmd-alt-ctrl-y = ['focus right', 'join-with down', 'layout tiles horizontal']
cmd-alt-ctrl-h = 'focus left'
cmd-alt-ctrl-j = 'focus down'
cmd-alt-ctrl-k = 'focus up'
cmd-alt-ctrl-l = 'focus right'
cmd-alt-ctrl-left = 'focus left'
cmd-alt-ctrl-down = 'focus down'
cmd-alt-ctrl-up = 'focus up'
cmd-alt-ctrl-right = 'focus right'
cmd-alt-ctrl-shift-h = 'move left'
cmd-alt-ctrl-shift-j = 'move down'
cmd-alt-ctrl-shift-k = 'move up'
cmd-alt-ctrl-shift-l = 'move right'
cmd-alt-ctrl-shift-left = 'move left'
cmd-alt-ctrl-shift-down = 'move down'
cmd-alt-ctrl-shift-up = 'move up'
cmd-alt-ctrl-shift-right = 'move right'
cmd-alt-ctrl-minus = 'resize smart -50'
cmd-alt-ctrl-equal = 'resize smart +50'
cmd-alt-ctrl-1 = 'workspace 1'
cmd-alt-ctrl-2 = 'workspace 2'
cmd-alt-ctrl-3 = 'workspace 3'
cmd-alt-ctrl-4 = 'workspace 4'
cmd-alt-ctrl-5 = 'workspace 5'
cmd-alt-ctrl-6 = 'workspace 6'
cmd-alt-ctrl-7 = 'workspace 7'
cmd-alt-ctrl-8 = 'workspace 8'
cmd-alt-ctrl-9 = 'workspace 9'
cmd-alt-ctrl-0 = 'workspace 0'
cmd-alt-ctrl-shift-1 = 'move-node-to-workspace 1'
cmd-alt-ctrl-shift-2 = 'move-node-to-workspace 2'
cmd-alt-ctrl-shift-3 = 'move-node-to-workspace 3'
cmd-alt-ctrl-shift-4 = 'move-node-to-workspace 4'
cmd-alt-ctrl-shift-5 = 'move-node-to-workspace 5'
cmd-alt-ctrl-shift-6 = 'move-node-to-workspace 6'
cmd-alt-ctrl-shift-7 = 'move-node-to-workspace 7'
cmd-alt-ctrl-shift-8 = 'move-node-to-workspace 8'
cmd-alt-ctrl-shift-9 = 'move-node-to-workspace 9'
cmd-alt-ctrl-shift-0 = 'move-node-to-workspace 0'
cmd-alt-ctrl-e = 'exec-and-forget open -a Finder.app'
cmd-alt-ctrl-t = 'exec-and-forget open -a iterm.app'
cmd-alt-ctrl-c = 'exec-and-forget open -a Zed.app'
cmd-alt-ctrl-b = 'exec-and-forget open -a Safari.app'
cmd-alt-ctrl-m = 'exec-and-forget open -a Music.app'
cmd-alt-ctrl-shift-t = 'exec-and-forget open -na iterm.app'
cmd-alt-ctrl-shift-b = 'exec-and-forget open -na Safari.app'
cmd-alt-ctrl-tab = 'workspace-back-and-forth'
cmd-alt-ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'
cmd-alt-ctrl-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = [
    'layout floating tiling',
    'mode main',
]
backspace = ['close-all-windows-but-current', 'mode main']
cmd-alt-ctrl-shift-h = ['join-with left', 'mode main']
cmd-alt-ctrl-shift-j = ['join-with down', 'mode main']
cmd-alt-ctrl-shift-k = ['join-with up', 'mode main']
cmd-alt-ctrl-shift-l = ['join-with right', 'mode main']
down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
if.window-title-regex-substring = 'Extension:'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.reminders'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
if.window-title-regex-substring = 'Sign In - Google Accounts'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.apple.Safari.WebApp.F2D52435-2C1F-47DE-ADA6-A1EB27D73838'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.figma.Desktop'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'hr.envox.eez.studio'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.google.GeminiMacOS'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam'
run = ['move-node-to-workspace 7']

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = ['move-node-to-workspace 7']


[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace 8']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 9']


[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = ['move-node-to-workspace 0']

[[on-window-detected]]
if.window-title-regex-substring = 'localhost|:3[0-9]{3}|Dev|development'
run = ['move-node-to-workspace 2', 'layout floating']

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'secondary'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'secondary'
0 = 'secondary'
